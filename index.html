function extractOpening(v){let s=clean(v).replace(/^\s*(?:\d+|[፩-፻፲-፺]+)[.)፡።:-]+\s*/u,'');let found=s.match(/ለ[^\s፡።,;]+(?:\s+[^\s፡።,;]+)?/u);return found?found[0]:s.split(/\s+/).slice(0,2).join(' ')}
function parseText(raw,format='auto'){let source=clean(raw.replace(/\r/g,''));if(!source)return[];let lines=source.split('\n'),pipeCount=lines.filter(x=>x.includes('|')).length;const numbered=/^\s*(?:\d{1,3}|[፩፪፫፬፭፮፯፰፱፲፳፴፵፶፷፸፹፺፻]+)[.)፡።:\-\s]+(.+)$/u;let numberedCount=lines.filter(x=>numbered.test(x)).length;if(format==='auto')format=pipeCount>=1&&pipeCount>=lines.filter(Boolean).length*.5?'pipe':numberedCount>=2?'numbered':source.split(/\n\s*\n/).length>=2?'blank':'line';let blocks=[];
if(format==='pipe'){blocks=lines.filter(x=>clean(x)).map(s=>{let p=s.indexOf('|');return p>=0?{opening:clean(s.slice(0,p)),text:clean(s.slice(p+1)),inferred:false}:{opening:clean(s),text:'',inferred:false}})}
else if(format==='numbered'){let cur='';for(let l of lines){let m=l.match(numbered);if(m){if(clean(cur))blocks.push(cur);cur=m[1]}else cur+='\n'+l}if(clean(cur))blocks.push(cur);blocks=blocks.map(x=>clean(x))}

else blocks=lines.map(clean).filter(Boolean);

function oneCollectionJSON(obj,name='Imported መልክእ'){if(Array.isArray(obj))obj={title:name,verses:obj};if(!obj||typeof obj!=='object')throw Error('Not a collection JSON');let v=[];if(Array.isArray(obj.verses)&&obj.verses.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))v=obj.verses.map(x=>({opening:clean(x.opening??x.start),text:clean(x.text??x.full)}));else if(Array.isArray(obj.lines))v=obj.lines.map((opening,i)=>({opening:clean(opening),text:clean(obj.verses?.[i])}));else if(Array.isArray(obj.openings))v=obj.openings.map((opening,i)=>({opening:clean(opening),text:clean(obj.fullVerses?.[i])}));else throw Error('Expected verses: [{opening, text}], lines: [], or openings: []');if(!v.length||v.length>500||v.some(x=>!x.opening))throw Error('Collection needs 1–500 valid openings');return{id:uid(),title:clean(obj.title)||name,verses:v,stats:{},media:{}}}

/* An offline ZIP archive with stored entries (no external libraries or internet). */
const utf8=new TextEncoder(),unutf8=new TextDecoder();
const crc32=bytes=>{let c=0xffffffff;for(let b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xedb88320:0)}return(c^0xffffffff)>>>0};
const bytesOf=async v=>v instanceof Uint8Array?v:new Uint8Array(v instanceof Blob?await v.arrayBuffer():utf8.encode(typeof v==='string'?v:JSON.stringify(v)));
function packLE(size,write){let a=new Uint8Array(size),v=new DataView(a.buffer);write(v);return a}
async function buildZIP(files){let pieces=[],central=[],offset=0;for(let f of files){let name=utf8.encode(f.name),raw=await bytesOf(f.bytes),crc=crc32(raw),l=packLE(30,v=>{v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0,true);v.setUint16(8,0,true);v.setUint32(14,crc,true);v.setUint32(18,raw.length,true);v.setUint32(22,raw.length,true);v.setUint16(26,name.length,true)}),cent=packLE(46,v=>{v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(10,0,true);v.setUint32(16,crc,true);v.setUint32(20,raw.length,true);v.setUint32(24,raw.length,true);v.setUint16(28,name.length,true);v.setUint32(42,offset,true)});pieces.push(l,name,raw);central.push(cent,name);offset+=l.length+name.length+raw.length}let len=central.reduce((s,x)=>s+x.length,0),end=packLE(22,v=>{v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,len,true);v.setUint32(16,offset,true)});return new Blob([...pieces,...central,end],{type:'application/zip'})}
async function exportArchive(){try{toast('Preparing full archive…');let manifest={...backupObject(),audioFiles:[]},files=[];for(let c of state.collections){for(let [local,name] of Object.entries(c.media||{})){let [ix,kind]=local.split(':'),blob=await mediaGet(audioKey(c.id,Number(ix),kind));if(!blob)continue;let ext=blob.type.includes('mp4')?'m4a':blob.type.includes('mpeg')?'mp3':blob.type.includes('wav')?'wav':'webm';let path=`recordings/${encodeURIComponent(c.id)}/${ix}-${kind}.${ext}`;manifest.audioFiles.push({path,key:audioKey(c.id,Number(ix),kind),mime:blob.type});files.push({name:path,bytes:blob})}}files.unshift({name:'melkea-backup.json',bytes:JSON.stringify(manifest,null,2)});let blob=await buildZIP(files);download(blob,'melkea-complete-archive.zip','application/zip');toast('Complete archive saved with '+(files.length-1)+' recording(s)')}catch(err){alert('Could not prepare archive: '+err.message)}}
async function restoreArchive(file){let raw=new Uint8Array(await file.arrayBuffer()),view=new DataView(raw.buffer),ptr=0,entries={};while(ptr+30<raw.length&&view.getUint32(ptr,true)===0x04034b50){let meth=view.getUint16(ptr+8,true),comp=view.getUint32(ptr+18,true),len=view.getUint16(ptr+26,true),extra=view.getUint16(ptr+28,true);if(meth!==0)throw Error('ZIP has compressed files; please import an archive created by this app');let path=unutf8.decode(raw.slice(ptr+30,ptr+30+len)),start=ptr+30+len+extra;entries[path]=raw.slice(start,start+comp);ptr=start+comp}if(!entries['melkea-backup.json'])throw Error('Archive does not contain melkea-backup.json');let backup=JSON.parse(unutf8.decode(entries['melkea-backup.json']));if(!confirm('Restore this complete archive? This replaces your collections and progress.'))return;for(let f of backup.audioFiles||[]){if(entries[f.path])await mediaPut(f.key,new Blob([entries[f.path]],{type:f.mime||'audio/webm'}))}restoreJSON(backup);modal='';render();toast(`Restored ${(backup.audioFiles||[]).length} recordings and your collections`)}

case 'tab':setTab(v);if(v==='audio')await loadAudio();break;
case 'pwa-install':{if(window.melkeaInstallPrompt){const p=window.melkeaInstallPrompt;window.melkeaInstallPrompt=null;await p.prompt();await p.userChoice;toast('You can open Memory Garden from your home screen once installed.')}else{toast('To install: Chrome/Edge menu → Install app or Add to Home screen; iPhone/iPad: Safari Share → Add to Home Screen.')}break;}
case 'settings':showModal('settings');break;
case 'save-settings':{state.settings.dailyNew=Math.max(0,Math.min(100,Number($('#daily-new').value)||0));state.settings.dailyReview=Math.max(1,Math.min(300,Number($('#daily-review').value)||10));save();modal='';render();toast('Daily goals saved');break}
case 'start-review':practiceMode='review';reviewIndex=null;reviewReveal=false;setTab('practice');break;

case 'audio-toggle':if(audioLoadedKey!==audioKey(state.active,audioIndex,audioKind))await loadAudio();if(!audioMaster.src){toast('Add an audio file first, or record yourself.');break}try{if(audioMaster.paused){audioMaster.playbackRate=audioSpeed;await audioMaster.play()}else audioMaster.pause();updateAudioUI()}catch(err){toast('Audio playback needs a user tap or a supported audio format.')}break;

case 'audio-remove':{if(!confirm(`Delete this ${audioKind} recording for verse ${audioIndex+1}?`))break;await mediaDelete(audioKey(state.active,audioIndex,audioKind));delete collection().media?.[`${audioIndex}:${audioKind}`];save();await loadAudio();render();toast('Recording deleted');break}
case 'record-start':await recordStart();break;

case 'new-collection':importRaw='';importTitle='';importMode='auto';showModal('new-collection');break;

case 'edit-by-id':editId=v;showModal('edit');break;
case 'save-edit':{let d=state.collections.find(c=>c.id===editId)||collection(),title=clean($('#edit-title').value),ops=$('#edit-openings').value.replace(/\r/g,'').split('\n').map(clean);while(ops.length&&!ops[ops.length-1])ops.pop();let full=$('#edit-bodies').value.replace(/\r/g,'').split(/\n---\n/).map(clean);if(!title||!ops.length||ops.length>500||ops.some(x=>!x)){toast('Enter a title and 1–500 non-empty openings.');break}if(full.length>ops.length&&full.slice(ops.length).some(Boolean)){toast('There are more full verses than openings. Check their alignment.');break}let changed=JSON.stringify(d.verses.map(v=>v.opening))!==JSON.stringify(ops);if(changed&&Object.keys(d.stats).length&&!confirm('Changing openings will reset this collection\'s review history. Continue?'))break;d.title=title;d.verses=ops.map((opening,i)=>({opening,text:full[i]||''}));if(changed){d.stats={};d.media={};gridOpened.clear();fullOpen.clear()}save();modal='';render();toast('Collection updated');break}
case 'delete-collection':
case 'delete-by-id':{
 if(state.collections.length<2){toast('Keep at least one collection. Add another before deleting this one.');break}
 let id=a==='delete-by-id'?v:state.active;
 if(!state.collections.some(c=>c.id===id)){toast('This collection no longer exists.');break}
 deleteId=id;showModal('delete');break;
}
case 'confirm-delete-collection':{
 let id=deleteId,d=state.collections.find(c=>c.id===id);
 if(!d||state.collections.length<2){modal='';deleteId=null;render();toast('Keep at least one collection.');break}
 if(id===state.active&&mediaRecorder?.state==='recording'){toast('Stop your recording before deleting this collection.');break}
 let wasActive=id===state.active,hadMedia=Object.keys(d.media||{}).length>0;
 if(wasActive){stopAudio();if(currentAudioUrl){URL.revokeObjectURL(currentAudioUrl);currentAudioUrl=''}audioMaster.removeAttribute('src');audioMaster.load();audioLoadedKey=''}
 let audioCleared=await purgeCollectionAudio(id);

 state.activity=state.activity.filter(a=>a.collection!==id);
 modal='';deleteId=null;
 if(wasActive)selectCollection(state.collections[0].id);else{save();render()}
 toast(!audioCleared&&hadMedia?'Collection deleted, but browser audio storage could not be fully cleared.':'Collection and its saved progress deleted.');
 break;
}

function preventForm(e){if(e.target.id==='next-form'){e.preventDefault();if(nextResult)return;let val=clean($('#next-answer').value),target=nextAt+nextDirection;if(!val){toast('Type your answer or use Reveal.');return}nextResult={guess:val};rate(target,normalizeAnswer(val)===normalizeAnswer(label(target))?'good':'again');render()}}

document.addEventListener('change',async e=>{let t=e.target;try{switch(t.id){

case 'grid-play-mode':gridPlayMode=t.value==='challenge'?'challenge':'free';gridChallenge=null;gridLastResult=null;gridOpened.clear();gridActive=null;gridFilter='all';render();break;

case 'show-full-cues':fullShowCue=t.checked;render();break;
case 'next-direction':nextDirection=Number(t.value)===-1?-1:1;nextAt=nextDirection===1?0:n()-1;nextResult=null;render();break;
case 'audio-verse':audioIndex=Number(t.value);audioA=0;audioB=null;stopAudio();render();await loadAudio();break;
case 'audio-speed':audioSpeed=Number(t.value)||1;audioMaster.playbackRate=audioSpeed;break;

case 'audio-pause':audioPause=Math.max(0,Math.min(30,Number(t.value)||0));break;

}}catch(err){console.error(err);toast('Could not read this file. '+err.message)}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='audio-timeline'){if(audioDuration())audioMaster.currentTime=Number(t.value)/1000;updateAudioUI()}else if(t.dataset.importOpen!==undefined){let i=Number(t.dataset.importOpen);if(importItems[i])importItems[i].opening=t.value}else if(t.dataset.importBody!==undefined){let i=Number(t.dataset.importBody);if(importItems[i])importItems[i].text=t.value}});

<script>
// PWA layer: this runs only on HTTPS or localhost. All collection data stays local.

window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();

    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.warn('Offline install unavailable:', err));
  }
});
